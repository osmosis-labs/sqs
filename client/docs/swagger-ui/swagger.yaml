swagger: '2.0'
info:
  title: SQS - gRPC Gateway docs
  description: A REST interface for SQS
  version: 1.0.0
paths:
  /pools:
    get:
      summary: Pools returns all the existing pools.
      operationId: Pools
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            title: 'TODO: Add more fields to the response'
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    '@type':
                      type: string
                  additionalProperties: {}
      parameters:
        - name: filter.pool_id
          description: >-
            pool_id is the pool id to query. If not provided, will return all
            pools.
          in: query
          required: false
          type: array
          items:
            type: string
            format: uint64
          collectionFormat: multi
        - name: filter.pool_id_not_in
          description: pool_id_not_in is the list of pool id to exclude from the query.
          in: query
          required: false
          type: array
          items:
            type: string
            format: uint64
          collectionFormat: multi
        - name: filter.type
          description: type is the pool type to filter pools by.
          in: query
          required: false
          type: array
          items:
            type: string
            format: uint64
          collectionFormat: multi
        - name: filter.incentive
          description: incentive is the incentive to filter pools by.
          in: query
          required: false
          type: array
          items:
            type: string
            enum:
              - SUPERFLUID
              - OSMOSIS
              - BOOST
              - NONE
          collectionFormat: multi
        - name: filter.min_liquidity_cap
          description: min_liquidity_cap is the minimum liquidity cap to filter pools by.
          in: query
          required: false
          type: string
          format: uint64
        - name: filter.with_market_incentives
          description: >-
            with_market_incentives indicates whether to include incentives into
            pools

            response.
          in: query
          required: false
          type: boolean
        - name: filter.search
          description: search is the search string to filter pools by.
          in: query
          required: false
          type: string
        - name: pagination.page
          description: |-
            page is the page number to query, starts at 0. If not provided, will
            default to first page.
          in: query
          required: false
          type: string
          format: uint64
        - name: pagination.limit
          description: >-
            limit is the total number of results to be returned in the result
            page.

            If left empty it will default to a value to be set by each app.
          in: query
          required: false
          type: string
          format: uint64
        - name: pagination.cursor
          description: >-
            cursor is the query offset to start from. If not provided, will
            default to

            the 0.
          in: query
          required: false
          type: string
          format: uint64
        - name: pagination.strategy
          description: >-
            strategy is the pagination strategy to be used. If not provided,
            will

            default to PAGE.

             - UNKNOWN: unknown strategy indicates that the pagination strategy is not known
            or not set.
             - PAGE: page-based pagination is the most common pagination strategy. It is
            compatible with offset pagination. If you have a page of 2 and a
            limit of

            20, you will get items 20-39.
             - CURSOR: cursor-based pagination is compatible with and similar to offset
            pagination. If you have a cursor of 50 and a limit of 20, you will
            get

            items 50-69. Client should re-request all data if it changes, as the
            cursor

            is not a pointer to a page, but to an item index.
          in: query
          required: false
          type: string
          enum:
            - UNKNOWN
            - PAGE
            - CURSOR
          default: UNKNOWN
      tags:
        - Query
  /passthrough/active-orders:
    get:
      summary: ActiveOrders returns all the active orders for a given address.
      operationId: ActiveOrders
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    '@type':
                      type: string
                      description: >-
                        A URL/resource name that uniquely identifies the type of
                        the serialized

                        protocol buffer message. This string must contain at
                        least

                        one "/" character. The last segment of the URL's path
                        must represent

                        the fully qualified name of the type (as in

                        `path/google.protobuf.Duration`). The name should be in
                        a canonical form

                        (e.g., leading "." is not accepted).


                        In practice, teams usually precompile into the binary
                        all types that they

                        expect it to use in the context of Any. However, for
                        URLs which use the

                        scheme `http`, `https`, or no scheme, one can optionally
                        set up a type

                        server that maps type URLs to message definitions as
                        follows:


                        * If no scheme is provided, `https` is assumed.

                        * An HTTP GET on the URL must yield a
                        [google.protobuf.Type][]
                          value in binary format, or produce an error.
                        * Applications are allowed to cache lookup results based
                        on the
                          URL, or have them precompiled into a binary to avoid any
                          lookup. Therefore, binary compatibility needs to be preserved
                          on changes to types. (Use versioned type names to manage
                          breaking changes.)

                        Note: this functionality is not currently available in
                        the official

                        protobuf release, and it is not used for type URLs
                        beginning with

                        type.googleapis.com. As of May 2023, there are no widely
                        used type server

                        implementations and no plans to implement one.


                        Schemes other than `http`, `https` (or the empty scheme)
                        might be

                        used with implementation specific semantics.
                  additionalProperties: {}
                  description: >-
                    `Any` contains an arbitrary serialized protocol buffer
                    message along with a

                    URL that describes the type of the serialized message.


                    Protobuf library provides support to pack/unpack Any values
                    in the form

                    of utility functions or additional generated methods of the
                    Any type.


                    Example 1: Pack and unpack a message in C++.

                        Foo foo = ...;
                        Any any;
                        any.PackFrom(foo);
                        ...
                        if (any.UnpackTo(&foo)) {
                          ...
                        }

                    Example 2: Pack and unpack a message in Java.

                        Foo foo = ...;
                        Any any = Any.pack(foo);
                        ...
                        if (any.is(Foo.class)) {
                          foo = any.unpack(Foo.class);
                        }
                        // or ...
                        if (any.isSameTypeAs(Foo.getDefaultInstance())) {
                          foo = any.unpack(Foo.getDefaultInstance());
                        }

                     Example 3: Pack and unpack a message in Python.

                        foo = Foo(...)
                        any = Any()
                        any.Pack(foo)
                        ...
                        if any.Is(Foo.DESCRIPTOR):
                          any.Unpack(foo)
                          ...

                     Example 4: Pack and unpack a message in Go

                         foo := &pb.Foo{...}
                         any, err := anypb.New(foo)
                         if err != nil {
                           ...
                         }
                         ...
                         foo := &pb.Foo{}
                         if err := any.UnmarshalTo(foo); err != nil {
                           ...
                         }

                    The pack methods provided by protobuf library will by
                    default use

                    'type.googleapis.com/full.type.name' as the type URL and the
                    unpack

                    methods only use the fully qualified type name after the
                    last '/'

                    in the type URL, for example "foo.bar.com/x/y.z" will yield
                    type

                    name "y.z".


                    JSON

                    ====

                    The JSON representation of an `Any` value uses the regular

                    representation of the deserialized, embedded message, with
                    an

                    additional field `@type` which contains the type URL.
                    Example:

                        package google.profile;
                        message Person {
                          string first_name = 1;
                          string last_name = 2;
                        }

                        {
                          "@type": "type.googleapis.com/google.profile.Person",
                          "firstName": <string>,
                          "lastName": <string>
                        }

                    If the embedded message type is well-known and has a custom
                    JSON

                    representation, that representation will be embedded adding
                    a field

                    `value` which holds the custom JSON in addition to the
                    `@type`

                    field. Example (for message [google.protobuf.Duration][]):

                        {
                          "@type": "type.googleapis.com/google.protobuf.Duration",
                          "value": "1.212s"
                        }
      parameters:
        - name: address
          description: >-
            address is the bech32-encoded address of the user to query active
            orders.
          in: query
          required: false
          type: string
        - name: inflation_min
          description: minimum inflation rate
          in: query
          required: false
          type: string
      tags:
        - Query

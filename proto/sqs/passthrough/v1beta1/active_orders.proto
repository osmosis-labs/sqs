syntax = "proto3";
package sqs.passthrough.v1beta1;

import "protoc-gen-openapiv2/options/annotations.proto";
import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "amino/amino.proto";
import "google/protobuf/any.proto";

option go_package = "github.com/osmosis-labs/sqs/pkg/api/v1beta1/passthrough";

// GetActiveOrdersRequest represents get active orders request for the
// Query.ActiveOrders RPC method.
message GetActiveOrdersRequest {
  // This comment will end up directly in your Open API definition
  string uuid = 1 
      [ (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        description : "The unique identifier of the simple message.",
        title : "123",
  extensions: {
            key: "x-goog-query-parameter";
            value {
                string_value: "qq";
            }
        }
      } ];

  // address is the bech32-encoded address of the user to query active orders.
  string address = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // minimum inflation rate
  string inflation_min = 3 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

message GetActiveOrdersResponse {}

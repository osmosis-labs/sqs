defaults:
  actions:
    backport:
      assignees:
        - "{{ author }}"

queue_rules:
  - name: default
    queue_conditions:
      - "#approved-reviews-by>=1"
      - base=v21.x
      - label=A:automerge
    merge_conditions:
      - "#approved-reviews-by>=1"
    merge_method: squash
    commit_message_template: |
      {{ title }} (#{{ number }})
      {{ body }}

pull_request_rules:
  - name: backport patches to osmosis-main branch
    conditions:
      - base=v22.x
      - label=A:backport/osmosis-main
    actions:
      backport:
        branches:
          - osmosis-main
  - name: backport patches to v21.x branch
    conditions:
      - base=v22.x
      - label=A:backport/v21.x
    actions:
      backport:
        branches:
          - v21.x
  - name: backport patches to v23.x branch
    conditions:
      - base=v22.x
      - label=A:backport/v23.x
    actions:
      backport:
        branches:
          - v23.x
  - name: backport patches to v24.x branch
    conditions:
      - base=v23.x
      - label=A:backport/v24.x
    actions:
      backport:
        branches:
          - v24.x
  - name: backport patches to v25.x branch
    conditions:
      - base=v24.x
      - label=A:backport/v25.x
    actions:
      backport:
        branches:
          - v25.x
  - name: refactored queue action rule
    conditions: []
    actions:
      queue:

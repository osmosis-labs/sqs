# This workflow pushes development images to ghcr.io/osmosis-labs/sqs-dev:
#
# For each matching branch push, release candidate tag, or manual run:
#     `ghcr.io/osmosis-labs/sqs-dev:{REF_NAME}-{SHORT_SHA}` is pushed.
#     `ghcr.io/osmosis-labs/sqs-dev:{REF_NAME}-{SHORT_SHA}-$(date +%s)` is pushed.
#
# Note: $(date +%s) is used to sort the tags in the docker registry.

name: Push Dev Images

on:
  push:
    branches:
      - "v[0-9]+.x"
      - osmosis-main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-rc*' # include rc
  workflow_dispatch:

env:
  DOCKER_REPOSITORY: ghcr.io/osmosis-labs/sqs-dev

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    -
      name: Check out repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    -
      name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    -
      name: Create Docker Image Tags
      run: |
        SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)
        echo "DOCKER_IMAGE_TAG=${{ github.ref_name }}-${SHORT_SHA}" >> $GITHUB_ENV
        echo "DOCKER_IMAGE_TAG_WITH_DATE=${{ github.ref_name }}-${SHORT_SHA}-$(date +%s)" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date +%s)" >> $GITHUB_ENV
        SHA=$(git rev-parse $(git rev-parse --abbrev-ref HEAD))
        echo "SHA=$SHA" >> $GITHUB_ENV
    -
      name: Build and Push Docker Images
      uses: docker/build-push-action@v5
      with:
        file: Dockerfile
        context: .
        push: true
        platforms: linux/amd64
        tags: |
          ${{ env.DOCKER_REPOSITORY }}:${{ env.DOCKER_IMAGE_TAG }}
          ${{ env.DOCKER_REPOSITORY }}:${{ env.DOCKER_IMAGE_TAG_WITH_DATE }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          repository_full_name=${{ github.repository }}
          repository_docker=${{ env.DOCKER_REPOSITORY }}
          ref_name=${{ github.ref_name }}
          commit_sha=${{ env.SHA }}
          tag=${{ env.DOCKER_IMAGE_TAG }}
          build_date=${{ env.BUILD_DATE }}
